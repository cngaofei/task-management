{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h2 class="page-title">编辑客诉 #{{ c.id }}</h2>
  <a href="{{ url_for('detail', cid=c.id) }}" class="btn btn-outline">返回详情</a>
</div>

<form class="form-card" method="post">
  <div class="form-row">
    <div class="form-group">
      <label>客户名称 <span class="required">*</span></label>
      <input type="text" name="customer" required value="{{ c.customer }}">
    </div>
    <div class="form-group">
      <label>跟进人 <span class="required">*</span></label>
      <input type="text" name="follower" required value="{{ c.follower }}">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>问题类型</label>
      <select name="problem_type">
        {% for t in problem_types %}
        <option value="{{ t }}" {{ 'selected' if c.problem_type == t }}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>严重程度</label>
      <select name="severity">
        {% for s in severity_levels %}
        <option value="{{ s }}" {{ 'selected' if c.severity == s }}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>解决期限</label>
      <input type="date" name="deadline" value="{{ c.deadline }}">
    </div>
  </div>

  <div class="form-group">
    <label>问题描述</label>
    <textarea name="description" rows="3">{{ c.description }}</textarea>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">保存修改</button>
    <a href="{{ url_for('detail', cid=c.id) }}" class="btn btn-outline">取消</a>
  </div>
</form>
{% endblock %}
