{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h2 class="page-title">新增客诉</h2>
  <a href="{{ url_for('complaint_list') }}" class="btn btn-outline">返回列表</a>
</div>

<form class="form-card" method="post">
  <div class="form-row">
    <div class="form-group">
      <label>客户名称 <span class="required">*</span></label>
      <input type="text" name="customer" required placeholder="请输入客户名称">
    </div>
    <div class="form-group">
      <label>跟进人 <span class="required">*</span></label>
      <input type="text" name="follower" required placeholder="请输入跟进人姓名">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>问题类型</label>
      <select name="problem_type">
        {% for t in problem_types %}
        <option value="{{ t }}">{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>严重程度</label>
      <select name="severity">
        {% for s in severity_levels %}
        <option value="{{ s }}" {{ 'selected' if s == '中' }}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>解决期限</label>
      <input type="date" name="deadline" value="{{ default_deadline }}">
    </div>
  </div>

  <div class="form-group">
    <label>问题描述</label>
    <textarea name="description" rows="3" placeholder="详细描述问题（可选）"></textarea>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">提交客诉</button>
    <a href="{{ url_for('complaint_list') }}" class="btn btn-outline">取消</a>
  </div>
</form>
{% endblock %}
